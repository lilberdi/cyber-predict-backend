openapi: 3.0.3
info:
  title: Cyber Predict API
  version: 0.1.0
  description: |
    Учебный API системы прогнозов матчей **Counter-Strike 2**.

    **Зачем этот сервис.** Фронтенд (и преподаватель на защите) забирает отсюда
    календарь ближайших матчей, вероятность победы и качество модели.
    Gin **только читает** PostgreSQL. Считает прогнозы Python:
    `python -m ml train`, `python -m ml sync`, `python -m ml predict`.

    **Данные.** HLTV не парсим (ToS, п. 2.2). Upcoming — PandaScore или локальные фикстуры.
    История обучения — sample / licensed датасет.

    **Дисклеймер.** Прогнозы учебные, не ставки и не финансовая рекомендация.

    Эндпоинты разбиты по разделам: служебные, матчи, прогнозы, модель, задачи.
    Календарь upcoming можно обновлять без консоли: GET/POST /api/v1/jobs/sync-upcoming
    и фоновый опрос раз в час (SYNC_INTERVAL).
  contact:
    name: Команда Cyber Predict
    url: https://github.com/lilberdi/cyber-predict

servers:
  - url: /
    description: Текущий хост (тот же, что открыл Swagger)
  - url: http://localhost:8082
    description: Локальный Docker / go run (PORT из .env)

tags:
  - name: Служебные
    description: Проверка, что процесс жив и видит базу. Нужны для Docker, демо и мониторинга.
  - name: Матчи
    description: Календарь и карточка встречи. Основной список для главной страницы UI.
  - name: Игроки
    description: Составы, трансферы и Team Impact Rating игроков
  - name: Прогнозы
    description: Вероятность победы по конкретному матчу. Пишет Python, отдаёт Gin.
  - name: Модель
    description: Метрики последнего обучения и источники данных. Страница «О модели».
  - name: Задачи
    description: Ручной запуск синхронизации календаря с PandaScore (тот же код, что тикер раз в час).

paths:
  /health:
    get:
      tags: [Служебные]
      operationId: getHealth
      summary: Проверка живости API и соединения с PostgreSQL
      description: |
        **Зачем.** Показать, что контейнер `api` поднялся и доходит до БД.
        Compose, скрипты и препод на защите начинают с этого URL.

        **Что делает.** `Ping` к PostgreSQL.
        - `200` и `{"status":"ok"}` — процесс и БД в порядке.
        - `503` — API слушает, но база недоступна (не путать с «сервис выключен»).

        Не читает матчи и не вызывает модель.
      responses:
        "200":
          description: Сервис и база доступны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOk"
              example:
                status: ok
        "503":
          description: База не отвечает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDegraded"
              example:
                status: degraded
                error: "ping postgres: connection refused"

  /api/v1/matches/upcoming:
    get:
      tags: [Матчи]
      operationId: listUpcomingMatches
      summary: Список предстоящих и идущих матчей
      description: |
        **Зачем.** Главный экран продукта: какие CS2-матчи скоро начнутся
        и какая вероятность победы уже посчитана.

        **Что делает.** Читает из PostgreSQL матчи со статусом `upcoming` или `running`,
        сортирует по `scheduled_at`, слева джойнит таблицу `predictions`.
        Если Python ещё не вызывал `predict`, поле `prediction` будет `null`.

        Не ходит в PandaScore в момент запроса — календарь заранее кладёт `python -m ml sync`.
      parameters:
        - name: limit
          in: query
          required: false
          description: Сколько матчей вернуть. По умолчанию 50, максимум 100. Меньше 1 тоже становится 50.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
            example: 8
      responses:
        "200":
          description: Список матчей; может быть пустым массивом
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"
              example:
                data:
                  - id: 481
                    external_id: fx-001
                    source: fixture
                    status: upcoming
                    best_of: 3
                    scheduled_at: "2026-09-25T16:00:00Z"
                    tournament: BLAST Open
                    team1: { id: 5, name: Team Spirit }
                    team2: { id: 4, name: Vitality }
                    score: { team1: null, team2: null }
                    prediction:
                      match_id: 481
                      model_name: elo_logreg
                      model_version: "0.1.0"
                      p_team1_win: 0.58
                      p_team2_win: 0.42
                      confidence: medium
                      explanation: Team Spirit оценивается выше.
        "500":
          description: Ошибка чтения PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/matches/finished:
    get:
      tags: [Матчи]
      operationId: listFinishedMatches
      summary: Сыгранные матчи — прогноз против факта
      description: |
        **Зачем.** Страница «Факт против прогноза»: показать, угадала ли модель реальные матчи.

        **Что делает.** Возвращает завершённые матчи, у которых прогноз был сохранён **до начала**
        игры (`predictions.created_at <= scheduled_at`), новые сверху. В каждом матче есть
        `winner_team_id` и `prediction_correct` (фаворит модели совпал с победителем).
        Прогнозы, посчитанные после старта, сюда не попадают.
      parameters:
        - name: limit
          in: query
          required: false
          description: Сколько матчей вернуть. По умолчанию 50, максимум 100.
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Список матчей; пуст, пока ни один из прогнозированных матчей не сыгран
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"
        "500":
          description: Ошибка чтения PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/matches/{id}:
    get:
      tags: [Матчи]
      operationId: getMatchById
      summary: Карточка одного матча
      description: |
        **Зачем.** Экран деталки: команды, формат BO1/BO3/BO5, турнир, счёт
        (если матч уже сыгран) и вложенный прогноз.

        **Что делает.** Ищет матч по внутреннему `id` (не `external_id` PandaScore).
        Тот же состав полей, что у элемента списка upcoming.

        `id` берётся из ответа `/matches/upcoming`, а не придумывается руками.
      parameters:
        - $ref: "#/components/parameters/MatchID"
      responses:
        "200":
          description: Матч найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "400":
          description: "`id` не целое положительное число"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { code: bad_request, message: id must be a positive integer }
        "404":
          description: Матча с таким id нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { code: not_found, message: match not found }
        "500":
          description: Ошибка чтения PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/rankings/players:
    get:
      tags: [Игроки]
      operationId: rankPlayers
      summary: Рейтинг игроков (Team Impact Rating)
      description: |
        **Что это.** Elo игрока, посчитанное только по результатам команд, пока игрок в составе.
        Сила команды = среднее по пятёрке, поэтому трансфер меняет силу обеих команд. Индивидуальную
        игру (K/D, ADR) рейтинг не оценивает: этих данных у нас нет.

        **Важно.** Рейтинг стартует с Elo команды на момент первого появления игрока в нашей базе
        (`rating_is_seed: true`, пока нет оценённых матчей). Используйте `min_games`, чтобы скрыть
        новичков без истории.
      parameters:
        - name: limit
          in: query
          description: По умолчанию 50, максимум 200.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: min_games
          in: query
          description: Минимум оценённых матчей (по умолчанию 0).
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Игроки по убыванию рейтинга
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerListResponse"
        "500":
          description: Ошибка чтения PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/players/{id}:
    get:
      tags: [Игроки]
      operationId: getPlayer
      summary: Карточка игрока
      description: Профиль, текущая команда, рейтинг, последние 50 изменений рейтинга и история команд.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Игрок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDetailResponse"
        "404":
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Ошибка чтения PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/teams/{id}:
    get:
      tags: [Игроки]
      operationId: getTeam
      summary: Карточка команды с текущим составом
      description: |
        Elo команды и текущий состав из PandaScore (в списке могут быть запасные).
        История составов ведётся с момента запуска отслеживания.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Команда
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetailResponse"
        "404":
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Ошибка чтения PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/transfers:
    get:
      tags: [Игроки]
      operationId: listTransfers
      summary: Последние трансферы
      description: |
        Изменения составов: `join` (появился в отслеживаемой команде), `leave` (покинул команду),
        `transfer` (из команды в команду). Первый снимок составов в ленту не попадает.
      parameters:
        - name: limit
          in: query
          description: По умолчанию 50, максимум 100.
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Изменения, новые сверху
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferListResponse"
        "500":
          description: Ошибка чтения PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/predictions/{id}:
    get:
      tags: [Прогнозы]
      operationId: getPredictionByMatchId
      summary: Прогноз исхода по id матча
      description: |
        **Зачем.** Отдельно отдать вероятность, когда UI уже знает матч
        или когда нужна только модель без карточки команд.

        **Что делает.** Ищет строку в `predictions`, где `match_id` = `{id}`.
        Путь `{id}` — это **id матча**, не суррогатный id прогноза.

        В ответе:
        - `p_team1_win` / `p_team2_win` — вероятности, сумма ≈ 1;
        - `confidence` — low / medium / high по отрыву от 0.5;
        - `top_features` — вклад Elo, формы, H2H (без post-match статы);
        - `explanation` — короткое пояснение на русском.

        **404**, если `python -m ml predict` ещё не считал этот матч.
        Модель в HTTP-запросе не вызывается.
      parameters:
        - $ref: "#/components/parameters/MatchID"
      responses:
        "200":
          description: Прогноз найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionResponse"
              example:
                data:
                  match_id: 481
                  model_name: elo_logreg
                  model_version: "0.1.0"
                  p_team1_win: 0.5788
                  p_team2_win: 0.4212
                  confidence: medium
                  top_features:
                    - { name: elo_diff, value: 41.29, impact: favors_team1 }
                    - { name: form5_diff, value: 0.2, impact: favors_team1 }
                    - { name: h2h_diff, value: 0.0, impact: favors_team2 }
                  explanation: Team Spirit оценивается выше (58% для Team Spirit). Разница Elo +41.
                  created_at: "2026-09-24T18:36:59Z"
        "400":
          description: Некорректный id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Прогноз ещё не посчитан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { code: not_found, message: prediction not found }
        "500":
          description: Ошибка чтения PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/jobs/sync-upcoming:
    get:
      tags: [Задачи]
      operationId: syncUpcomingGet
      summary: Обновить предстоящие матчи (топ-60)
      description: |
        Тянет календарь CS2 с PandaScore и оставляет матчи команд из топ-набора
        (seed известных оргов + топ по нашему Elo, размер TOP_TEAMS, по умолчанию 60).
        По умолчанию нужны обе команды из набора; если таких пар нет — оставляем матчи,
        где хотя бы одна сторона в топ-наборе.

        Тот же код запускается сам раз в час (SYNC_INTERVAL). Консоль python -m ml sync
        больше не обязательна.

        Нужен PANDASCORE_TOKEN. Успешный sync удаляет старые fixture-upcoming.
        Для новых матчей пишется быстрый Elo-прогноз (elo_sync), пока не пересчитаете полный logreg.
      parameters:
        - name: X-Sync-Key
          in: header
          required: false
          description: Нужен только если задан SYNC_SECRET
          schema: { type: string }
      responses:
        "200":
          description: Календарь обновлён или частично обновлён
        "401":
          description: Неверный X-Sync-Key
        "502":
          description: PandaScore недоступен или нет токена
    post:
      tags: [Задачи]
      operationId: syncUpcomingPost
      summary: Обновить предстоящие матчи (POST)
      description: То же, что GET /api/v1/jobs/sync-upcoming. Удобно вызывать из крона снаружи.
      responses:
        "200":
          description: Календарь обновлён
        "502":
          description: PandaScore недоступен

  /api/v1/model/live-accuracy:
    get:
      tags: [Модель]
      operationId: getLiveAccuracy
      summary: Реальная точность на сыгранных матчах
      description: |
        **Зачем.** Честная проверка модели «в бою»: доля угаданных матчей среди тех, что
        мы спрогнозировали до начала и которые уже сыграны. Растёт со временем.

        **Что делает.** Сравнивает фаворита из `predictions` с победителем в `matches`.
        Учитываются только прогнозы, сохранённые до старта; ровные 50/50 исключены.
        Разрезы: по уверенности (`by_confidence`) и по модели (`by_model`: `elo_xgboost`, `elo_sync`).
        Пока сыгранных матчей нет, `evaluated = 0`.
      responses:
        "200":
          description: Счётчики точности
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveAccuracyResponse"
              example:
                data:
                  evaluated: 12
                  correct: 8
                  accuracy: 0.667
                  by_confidence:
                    high: { evaluated: 4, correct: 3, accuracy: 0.75 }
                    low: { evaluated: 8, correct: 5, accuracy: 0.625 }
                  by_model:
                    elo_xgboost: { evaluated: 12, correct: 8, accuracy: 0.667 }
                  since: "2026-10-16T07:00:00Z"
                  note: Only predictions stored before the match start are counted; exact 50/50 calls are excluded.
        "500":
          description: Ошибка чтения PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/model/metrics:
    get:
      tags: [Модель]
      operationId: getModelMetrics
      summary: Метрики последнего обучения
      description: |
        **Зачем.** Страница «О модели» и отчёт для защиты: чем мерили качество
        и с чем сравнивали (правило «всегда побеждает фаворит Elo»).

        **Что делает.** Берёт последнюю строку `model_metrics` (после `python -m ml train`)
        и добавляет дисклеймер плюс список источников данных.
        Саму модель заново не обучает.

        Поля для рассказа на защите:
        - `accuracy` — доля верных исходов на хронологическом тесте;
        - `log_loss`, `brier` — качество вероятностей (чем меньше, тем лучше);
        - `elo_favorite_accuracy` — baseline без ML;
        - `n_train` / `n_test` — размер выборки.

        **404**, если train ещё не запускали.
      responses:
        "200":
          description: Есть хотя бы одно обучение
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelMetricsResponse"
              example:
                data:
                  model_name: elo_logreg
                  model_version: "0.1.0"
                  trained_at: "2026-09-24T18:36:59Z"
                  n_train: 384
                  n_test: 96
                  accuracy: 0.65625
                  log_loss: 0.657
                  brier: 0.230
                  elo_favorite_accuracy: 0.65625
                  disclaimer: Учебный прототип. Прогнозы не являются ставками или финансовой рекомендацией.
                  data_sources:
                    - "historical: bundled sample CS2-style match history"
                    - "upcoming: PandaScore or local fixtures"
        "404":
          description: Обучения ещё не было
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { code: not_found, message: model has not been trained yet }
        "500":
          description: Ошибка чтения PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    MatchID:
      name: id
      in: path
      required: true
      description: Внутренний идентификатор матча из PostgreSQL (`matches.id`).
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 481

  schemas:
    HealthOk:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    HealthDegraded:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [degraded]
        error:
          type: string
    Team:
      type: object
      required: [id, name]
      description: Команда в карточке матча
      properties:
        id: { type: integer, format: int64, example: 5 }
        name: { type: string, example: Team Spirit }
        slug: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
    Player:
      type: object
      required: [id, nickname, rated_matches, rating_is_seed]
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string, example: ZywOo }
        slug: { type: string, nullable: true }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        nationality: { type: string, nullable: true, example: FR, description: Код страны ISO }
        image_url: { type: string, nullable: true }
        team: { $ref: "#/components/schemas/Team" }
        joined_at: { type: string, format: date-time, description: Когда мы впервые увидели игрока в этой команде }
        rating: { type: number, nullable: true, example: 1523.4 }
        rated_matches: { type: integer, description: Сколько матчей учтено в рейтинге }
        rating_is_seed: { type: boolean, description: true - рейтинг ещё равен стартовому (Elo команды) }
        rank: { type: integer, description: "Место в выдаче. При равном (округлённом до целого) рейтинге место общее: 1, 1, 3" }
    RatingPoint:
      type: object
      properties:
        match_id: { type: integer, format: int64 }
        played_at: { type: string, format: date-time }
        team_id: { type: integer, format: int64 }
        rating_after: { type: number }
        delta: { type: number }
    RosterStint:
      type: object
      properties:
        team: { $ref: "#/components/schemas/Team" }
        joined_at: { type: string, format: date-time }
        left_at: { type: string, format: date-time, nullable: true }
    PlayerDetail:
      allOf:
        - $ref: "#/components/schemas/Player"
        - type: object
          properties:
            rating_history: { type: array, items: { $ref: "#/components/schemas/RatingPoint" } }
            teams: { type: array, items: { $ref: "#/components/schemas/RosterStint" } }
    TeamDetail:
      allOf:
        - $ref: "#/components/schemas/Team"
        - type: object
          properties:
            elo: { type: number, nullable: true }
            elo_matches: { type: integer }
            roster: { type: array, items: { $ref: "#/components/schemas/Player" } }
            roster_note: { type: string }
    Transfer:
      type: object
      properties:
        player: { $ref: "#/components/schemas/Player" }
        kind: { type: string, enum: [join, leave, transfer] }
        from_team: { $ref: "#/components/schemas/Team" }
        to_team: { $ref: "#/components/schemas/Team" }
        changed_at: { type: string, format: date-time }
    PlayerListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Player" } }
    PlayerDetailResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/PlayerDetail" }
    TeamDetailResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/TeamDetail" }
    TransferListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Transfer" } }
    Score:
      type: object
      description: Счёт по картам. Для upcoming оба поля null.
      properties:
        team1: { type: integer, nullable: true }
        team2: { type: integer, nullable: true }
    FeatureContribution:
      type: object
      description: Один pre-match признак и в чью пользу он играет
      properties:
        name: { type: string, example: elo_diff }
        value: { type: number, example: 41.29 }
        impact:
          type: string
          enum: [favors_team1, favors_team2]
    Prediction:
      type: object
      required: [match_id, model_name, model_version, p_team1_win, p_team2_win]
      description: Вероятность победы team1 / team2 на момент расчёта
      properties:
        match_id: { type: integer, format: int64 }
        model_name: { type: string, example: elo_logreg }
        model_version: { type: string, example: "0.1.0" }
        p_team1_win: { type: number, minimum: 0, maximum: 1 }
        p_team2_win: { type: number, minimum: 0, maximum: 1 }
        confidence: { type: string, enum: [low, medium, high], nullable: true }
        top_features:
          type: array
          items:
            $ref: "#/components/schemas/FeatureContribution"
        explanation: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    Match:
      type: object
      required: [id, source, status, team1, team2]
      description: Встреча двух команд. Прогноз вложен, если уже посчитан.
      properties:
        id: { type: integer, format: int64 }
        external_id: { type: string, nullable: true, description: "ps-… или fx-… или sample-…" }
        source: { type: string, enum: [pandascore, dataset, fixture] }
        status: { type: string, enum: [upcoming, running, finished] }
        best_of: { type: integer, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        tournament: { type: string, nullable: true }
        tournament_tier: { type: string, nullable: true }
        team1: { $ref: "#/components/schemas/Team" }
        team2: { $ref: "#/components/schemas/Team" }
        score: { $ref: "#/components/schemas/Score" }
        winner_team_id: { type: integer, format: int64, nullable: true }
        prediction:
          allOf:
            - $ref: "#/components/schemas/Prediction"
          nullable: true
        prediction_correct:
          type: boolean
          description: Только в `/matches/finished`. true, если фаворит модели выиграл матч.
    ModelMetrics:
      type: object
      description: Последний отчёт обучения + юридические пометки
      properties:
        model_name: { type: string }
        model_version: { type: string }
        trained_at: { type: string, format: date-time }
        n_train: { type: integer }
        n_test: { type: integer }
        accuracy: { type: number }
        log_loss: { type: number }
        brier: { type: number }
        elo_favorite_accuracy: { type: number }
        extra:
          type: object
          description: >
            Сравнение моделей (`comparison`: Elo / logreg / XGBoost), список признаков,
            `feature_importance` (gain XGBoost), `active_model`, `data` (источник и размер истории),
            `walk_forward` (среднее и разброс по 5 окнам), `significance` (95% доверительные
            интервалы), `ablation` (вклад каждого нового признака), `calibration` (ECE и
            таблица надёжности), `known_teams_only` (метрики только по командам с историей).
          additionalProperties: true
        disclaimer: { type: string }
        data_sources:
          type: array
          items: { type: string }
    AccuracyBucket:
      type: object
      properties:
        evaluated: { type: integer }
        correct: { type: integer }
        accuracy: { type: number }
    LiveAccuracy:
      type: object
      properties:
        evaluated: { type: integer }
        correct: { type: integer }
        accuracy: { type: number }
        by_confidence:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AccuracyBucket" }
        by_model:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AccuracyBucket" }
        since: { type: string, format: date-time, nullable: true }
        note: { type: string }
    LiveAccuracyResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/LiveAccuracy"
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: not_found }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    MatchListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Match"
    MatchResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Match"
    PredictionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Prediction"
    ModelMetricsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ModelMetrics"
