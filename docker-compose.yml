services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyber
      POSTGRES_PASSWORD: cyber
      POSTGRES_DB: cyber_predict
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber -d cyber_predict"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "${PORT:-18080}:${PORT:-18080}"
    environment:
      PORT: ${PORT:-18080}
      DATABASE_URL: postgres://cyber:cyber@postgres:5432/cyber_predict?sslmode=disable
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MIGRATIONS_PATH: file://migrations
      PANDASCORE_TOKEN: ${PANDASCORE_TOKEN:-}
      PANDASCORE_BASE_URL: ${PANDASCORE_BASE_URL:-https://api.pandascore.co}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-1h}
      SYNC_SECRET: ${SYNC_SECRET:-}
      TOP_TEAMS: ${TOP_TEAMS:-60}
      SYNC_REQUIRE_BOTH: ${SYNC_REQUIRE_BOTH:-false}
    depends_on:
      postgres:
        condition: service_healthy

  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    environment:
      DATABASE_URL: postgres://cyber:cyber@postgres:5432/cyber_predict?sslmode=disable
      MODEL_VERSION: ${MODEL_VERSION:-0.2.0}
      PREDICT_INTERVAL_SECONDS: ${PREDICT_INTERVAL_SECONDS:-600}
    volumes:
      - mlartifacts:/app/ml/artifacts
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  mlartifacts:
